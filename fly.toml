# Unique app name is assigned by `fly launch`.
# primary_region sin matches typical UTC+8 latency.

app = 'spotibai'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DATA_DIR = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'spotibai_data'
  destination = '/data'
